<div>
  <mat-toolbar class="search-bar">
      <button mat-icon-button (click)="goToSearch()" class="search-icon" aria-label="Example icon-button with menu icon">
          <mat-icon>search</mat-icon>
      </button>
        <!-- <mat-form-field>
      <input matInput aria-label="search" [(ngModel)]="searchTerm" placeholder="Type to Search..."/>
    </mat-form-field> -->
      <input aria-label="search" [(ngModel)]="searchTerm" placeholder="Type to Search..."/>
    <span class="example-spacer"></span>
    <!-- <button mat-icon-button (click)="goToFav()" class="favorite-icon" aria-label="Example icon-button with heart icon">
      <mat-icon>favorite</mat-icon>
    </button> -->
    @if(user | async; as currentUser){
      <button mat-icon-button class="profile-button" aria-label="Example icon-button with share icon">
        <mat-icon>account_circle </mat-icon>
        <span>{{ currentUser.username }}</span> 
      </button>
    }@else{
      <button mat-button class="login-button" (click)="goToAuth()">Login</button>
    }
  
  </mat-toolbar>
  <mat-toolbar class="nav-bar">
    <h1>Recipes</h1>
      <!-- <mat-form-field>
    <input matInput aria-label="search" [(ngModel)]="searchTerm" placeholder="Type to Search..."/>
  </mat-form-field> -->
    <span class="example-spacer"></span>
    <button mat-icon-button class="menu-icon" (click)="onToggle()" aria-label="Example icon-button with heart icon">
      <mat-icon>menu</mat-icon>
    </button>
  </mat-toolbar>
</div>
