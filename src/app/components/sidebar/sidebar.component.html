<section>
    <h3>tags</h3>
    <div class="tags">
        @for(category of categoriesList(); track category.idCategory){
            <a [routerLink]="['/', category.strCategory, 'recipes']" class="tag">{{ category.strCategory }}</a>
        }
    </div>
</section>
<section>
    <h3>search</h3>
    <input type="text" placeholder="search" [(ngModel)]="searchTerm" aria-label="search" (keydown.enter)="goToSearch()">
    <button type="button" aria-label="search button" (click)="goToSearch()">search</button>
</section>
